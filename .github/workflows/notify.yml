name: TMKOC notify

on:
  schedule:
    - cron: "2,12,22,32,42,52 0-3 * * *"
    - cron: "2,12,22,32,42,52 12-17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ott-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        run: python bot.py

      - name: Save state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update episode notification state"
