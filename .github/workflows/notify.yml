name: TMKOC notify

on:
  schedule:
    # India 7:32 PM se 10:22 PM tak, har 10 minute (UTC 14:02 se 16:52)
    # :00/:30 avoid kiye hain kyunki GitHub pe unpe bheed hoti hai
    - cron: "2,12,22,32,42,52 14-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ott-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run notifier
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python bot.py

      - name: Save episode state
        if: always()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update episode notification state" || true
            git pull --rebase origin main || true
            git push
          fi
