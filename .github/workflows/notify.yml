name: TMKOC notify

on:
  schedule:
    # 🌅 Subah 5:32 AM se 9:22 AM IST tak (har 10 minute)
    - cron: "2,12,22,32,42,52 0-3 * * *"

    # 🌙 Shaam 5:32 PM se 11:22 PM IST tak (har 10 minute)
    - cron: "2,12,22,32,42,52 12-17 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ott-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run notifier
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python bot.py

      - name: Save episode state
        if: always()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update episode notification state" || true
            git pull --rebase origin main || true
            git push
          fi
